{% extends "base.html" %}

{% block title %}Login — Crockery Wholesale Partnership Accounting System{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 mb-3 shadow-sm" style="width: 56px; height: 56px;">
                <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h2>Crockery Accounts</h2>
            <p>Wholesale Partnership Accounting System</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >
                </div>
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100 py-2 mt-2"
            >
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>

        </form>

        <div class="login-footer-hint mt-4">
            <i class="bi bi-info-circle me-1"></i> Default login: <strong>admin</strong> / <strong>admin123</strong>
        </div>

    </div>

</div>

{% endblock %}
